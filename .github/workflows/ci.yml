name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci          # also builds dist/ (prepare)
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:self   # the tests again, on .ts files smaltty stripped
      - run: npm run bench -- --quick   # checks the harness runs; timings on CI runners are not recorded
